spring:
  application:
    name: saakh
  datasource:
    url: jdbc:postgresql://localhost:5433/apexledger
    username: apexledger
    password: apexledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    kafka:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"

saakh:
  security:
    api-key: local-dev-key
    internal-api-key: local-internal-key
  outbox:
    enabled: true
    topic: saakh.transfers
    batch-size: 25
    poll-delay-ms: 500
