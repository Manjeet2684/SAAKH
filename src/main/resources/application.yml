spring:
  application:
    name: saakh
  datasource:
    url: jdbc:postgresql://localhost:5433/apexledger
    username: apexledger
    password: apexledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8080

saakh:
  security:
    api-key: local-dev-key
    internal-api-key: local-internal-key
  outbox:
    enabled: true
    topic: saakh.transfers
    batch-size: 25
    poll-delay-ms: 500
