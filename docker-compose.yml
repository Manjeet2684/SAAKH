services:
  postgres:
    image: postgres:16-alpine
    container_name: saakh-postgres
    environment:
      POSTGRES_DB: apexledger
      POSTGRES_USER: apexledger
      POSTGRES_PASSWORD: apexledger
    ports:
      # 5433 on the host avoids colliding with a local Windows PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - saakh_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexledger -d apexledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker is used in Phase 3 by the outbox publisher. The posting transaction
  # still does not talk to Kafka. Start with: docker compose up -d postgres kafka
  kafka:
    image: apache/kafka:3.8.1
    container_name: saakh-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  app:
    build: .
    image: saakh:local
    container_name: saakh-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apexledger
      SPRING_DATASOURCE_USERNAME: apexledger
      SPRING_DATASOURCE_PASSWORD: apexledger
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SAAKH_SECURITY_API_KEY: local-dev-key
      SAAKH_SECURITY_INTERNAL_API_KEY: local-internal-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  saakh_postgres:
